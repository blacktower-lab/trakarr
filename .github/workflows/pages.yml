name: Pages

# Publishes the landing page in site/ with no build, and the shared assets/ next
# to it. In the repo the page reaches them as ../assets/, but on Pages it sits at
# the site's root, so those links are rewritten to assets/.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Put the page and the assets together
        run: |
          mkdir _site
          cp -R site/. _site/
          cp -R assets _site/assets
          sed -i 's#\.\./assets/#assets/#g' _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
