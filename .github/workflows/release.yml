name: Release

# A version tag publishes the tarball install.sh downloads. The release is
# published, not a draft: install.sh looks for the latest one. Its notes are
# the body of the tag's message, written for the people who run trakarr:
#   git tag -a v1.2.3 -m "v1.2.3" -m "<the notes, in Markdown>"
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test
      - run: scripts/package.sh "$GITHUB_REF_NAME"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # checkout leaves the tag without its message, so it's fetched whole.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          # A tag with no body, or one with no message at all, gets GitHub's list of changes.
          notes=(--generate-notes)
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag ]; then
            body=$(git tag --list --format='%(contents:body)' "$GITHUB_REF_NAME")
            if [ -n "$body" ]; then
              printf '%s\n' "$body" > "$RUNNER_TEMP/notes.md"
              notes=(--notes-file "$RUNNER_TEMP/notes.md")
            fi
          fi
          gh release create "$GITHUB_REF_NAME" "trakarr-$GITHUB_REF_NAME.tar.gz" --title "$GITHUB_REF_NAME" "${notes[@]}"
